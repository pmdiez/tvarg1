<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Volver - Shaka Player con MPD Modificado</title>
    <script src="https://ajax.googleapis.com/ajax/libs/shaka-player/4.12.0/shaka-player.compiled.js"></script>
</head>
<body>
    <video id="video" controls autoplay width="100%"></video>
    
    <script>
        const keyId = '194e53184a424ce6989ad82c5f28fbc5';
        const key = '65d60c5cc4de031172be0a6a51edbdfe';
        
        const originalMpdUrl = "https://flow-cdn-gcp.app.flow.com.ar/tok_eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJleHAiOiIxNzgwMTQxMDEzIiwic2lwIjoiODQuMjUyLjExNC44IiwicGF0aCI6Ii9saXZlL2M2ZWRzL1ROVF9TcG9ydHNfSEQvU0FfTGl2ZV9kYXNoX2VuY18yMi8iLCJzZXNzaW9uX2Nkbl9pZCI6IjhkNjcxMGMxZGYwMTA4YWMiLCJzZXNzaW9uX2lkIjoiIiwiY2xpZW50X2lkIjoiIiwiZGV2aWNlX2lkIjoiIiwibWF4X3Nlc3Npb25zIjowLCJzZXNzaW9uX2R1cmF0aW9uIjowLCJ1cmwiOiJodHRwczovLzIwMS4yMzUuNjYuMTIyIiwiYXVkIjoiMzM5Iiwic291cmNlcyI6WzIwOSw4NSwxNDQsODYsODhdfQ==.S8P7hHNwTwy2zv1N8aflrtf_jJlkytqX5UBK6njp4nT6bUIkbfpZtbquqD4NLU5B_bEQYKJTUd587f5fNdTDKQ==/live/c6eds/Volver/SA_Live_dash_enc/Volver.mpd";
        
        async function init() {
            // 1. Descargar el MPD original
            const response = await fetch(originalMpdUrl);
            let mpdText = await response.text();
            
            // 2. Modificar el MPD para añadir Clear Key
            const clearkeyXml = `
<ContentProtection schemeIdUri="urn:uuid:1077efec-c0b2-4d02-ace3-3c1e52e2fb4b">
  <mspr:pro>ClearKey</mspr:pro>
</ContentProtection>`;
            
            // Insertar la etiqueta de Clear Key después de las existentes
            mpdText = mpdText.replace('</ContentProtection>', '</ContentProtection>' + clearkeyXml);
            
            // 3. Crear un Blob URL con el MPD modificado
            const modifiedMpdBlob = new Blob([mpdText], { type: 'application/dash+xml' });
            const modifiedMpdUrl = URL.createObjectURL(modifiedMpdBlob);
            
            // 4. Configurar Shaka Player
            const video = document.getElementById('video');
            const player = new shaka.Player(video);
            
            const clearKeys = {};
            clearKeys[keyId] = key;
            
            player.configure({
                drm: {
                    clearKeys: clearKeys,
                    preferredKeySystems: ['org.w3.clearkey']
                }
            });
            
            player.addEventListener('error', (e) => {
                console.error('Error:', e.detail);
                document.body.innerHTML += `<p style="color:red">Error: ${e.detail.message}</p>`;
            });
            
            try {
                await player.load(modifiedMpdUrl);
                console.log('✅ Cargado con MPD modificado');
            } catch (e) {
                console.error(e);
                document.body.innerHTML += `<p style="color:red">Falló: ${e.message}</p>`;
            }
        }
        
        init();
    </script>
</body>
</html>
