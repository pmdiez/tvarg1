<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flow - Volver (Prueba de claves)</title>
    <style>
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
        }
        .container {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 20px;
        }
        video {
            width: 100%;
            border-radius: 12px;
            background: #000;
        }
        .info {
            margin-top: 15px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            color: #0f0;
            font-size: 12px;
        }
        .error {
            color: #f00;
            background: #300;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        .key-option {
            background: #333;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }
        .key-option:hover {
            background: #444;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/shaka-player/4.12.0/shaka-player.compiled.js"></script>
</head>
<body>
    <div class="container">
        <video id="video" controls autoplay></video>
        
        <div class="info">
            <strong>🎬 Volver - Flow</strong><br>
            KID correcto del MPD: <code>194e53184a424ce6989ad82c5f28fbc5</code><br>
            <span id="status">🔑 Probando claves...</span>
        </div>
        
        <div class="error" id="error"></div>
        
        <div style="margin: 15px 0;">
            <div class="key-option" onclick="testKey('194e53184a424ce6989ad82c5f28fbc5', '65d60c5cc4de031172be0a6a51edbdfe')">
                🔑 Opción 1: KEY que me diste
            </div>
            <div class="key-option" onclick="testKey('194e53184a424ce6989ad82c5f28fbc5', '')">
                🔓 Opción 2: Sin KEY (video sin DRM)
            </div>
        </div>
        
        <div class="info" style="font-size: 11px; color: #888;">
            💡 Si ninguna funciona, la KEY es incorrecta.<br>
            Necesitas obtener la KEY real del servidor de licencias de Flow.
        </div>
    </div>

    <script>
        let player = null;
        
        const MPD_URL = 'https://flow-cdn-gcp.app.flow.com.ar/tok_eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJleHAiOiIxNzgwMTQxMDEzIiwic2lwIjoiODQuMjUyLjExNC44IiwicGF0aCI6Ii9saXZlL2M2ZWRzL1ROVF9TcG9ydHNfSEQvU0FfTGl2ZV9kYXNoX2VuY18yMi8iLCJzZXNzaW9uX2Nkbl9pZCI6IjhkNjcxMGMxZGYwMTA4YWMiLCJzZXNzaW9uX2lkIjoiIiwiY2xpZW50X2lkIjoiIiwiZGV2aWNlX2lkIjoiIiwibWF4X3Nlc3Npb25zIjowLCJzZXNzaW9uX2R1cmF0aW9uIjowLCJ1cmwiOiJodHRwczovLzIwMS4yMzUuNjYuMTIyIiwiYXVkIjoiMzM5Iiwic291cmNlcyI6WzIwOSw4NSwxNDQsODYsODhdfQ==.S8P7hHNwTwy2zv1N8aflrtf_jJlkytqX5UBK6njp4nT6bUIkbfpZtbquqD4NLU5B_bEQYKJTUd587f5fNdTDKQ==/live/c6eds/Volver/SA_Live_dash_enc/Volver.mpd';
        
        async function testKey(keyId, keyValue) {
            const video = document.getElementById('video');
            const statusSpan = document.getElementById('status');
            const errorDiv = document.getElementById('error');
            
            if (player) {
                player.destroy();
                player = null;
            }
            
            if (!shaka.Player.isBrowserSupported()) {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = '❌ Usa Chrome';
                return;
            }
            
            player = new shaka.Player(video);
            
            if (keyValue && keyValue !== '') {
                const clearKeys = {};
                clearKeys[keyId] = keyValue;
                player.configure({
                    drm: {
                        clearKeys: clearKeys,
                        preferredKeySystems: ['org.w3.clearkey']
                    }
                });
                statusSpan.innerHTML = `🔑 Probando KEY: ${keyValue.substring(0,8)}...`;
            } else {
                player.configure({ drm: { enabled: false } });
                statusSpan.innerHTML = '🔓 Probando sin DRM...';
            }
            
            player.addEventListener('error', (event) => {
                const error = event.detail;
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `❌ ${error.message}`;
                statusSpan.innerHTML = '❌ Clave incorrecta o video protegido';
            });
            
            player.addEventListener('loaded', () => {
                statusSpan.innerHTML = '✅ ¡Funciona!';
                errorDiv.style.display = 'none';
            });
            
            try {
                await player.load(MPD_URL);
            } catch (error) {
                // Error ya manejado
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('status').innerHTML = 'Selecciona una opción';
        });
    </script>
</body>
</html>
