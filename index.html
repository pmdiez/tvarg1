        function parseChannels() {
            const parsedChannels = [];
            const lines = rawData.split('\n');
            
            for (const line of lines) {
                const cleanLine = line.trim();
                if (!cleanLine) continue;
                
                const match = cleanLine.match(/^([^\[\]]*?)\[([^\]]+)\]\(([^)]+)\)(.*)$/);
                if (match) {
                    let icon = match[1].trim();
                    if (!icon) icon = '📺';
                    
                    const name = match[2].replace(/_/g, ' ');
                    const url = match[3];
                    const rest = match[4];
                    
                    const mirrors = [];
                    const mirrorRegex = /\[\(([^)]+)\)\]\(([^)]+)\)/g;
                    let m;
                    while ((m = mirrorRegex.exec(rest)) !== null) {
                        mirrors.push({ name: m[1], url: m[2] });
                    }
                    
                    let category = 'TV';
                    if (icon.includes('🎥')) category = 'Cine';
                    else if (icon.includes('⚽')) category = 'Deportes';
                    else if (icon.includes('🏀')) category = 'Basket';
                    else if (icon.includes('📰')) category = 'Noticias';
                    else if (icon.includes('🌍')) category = 'Docu/Cultura';
                    else if (icon.includes('🧸')) category = 'Infantil';
                    else if (icon.includes('🎵')) category = 'Música';
                    else if (icon.includes('🔞')) category = 'Adultos';
                    else if (icon.includes('🌐')) category = 'Internacional';

                    parsedChannels.push({ icon, name, url, mirrors, category });
                }
            }
            return parsedChannels;
        }

            } catch (e) {
                console.error("Init error:", e);
                if (channelGrid) {
                    channelGrid.innerHTML = `<div class="col-span-full p-4 bg-red-100 text-red-700 rounded border border-red-200">Error al cargar: ${e.message}<br><small>Revisa la consola del navegador (F12) para más detalles.</small></div>`;
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
