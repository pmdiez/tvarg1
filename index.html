<script>
(function () {
  'use strict';

  var env = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('f');
  var pw = document.getElementById('pw');
  var rm = document.getElementById('rm');
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');
  var KEY = 'acceso-privado';

  function fromBase64(text) {
    var binary = atob(text);
    var out = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) out[i] = binary.charCodeAt(i);
    return out;
  }

  function unlock(password) {
    return crypto.subtle
      .importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: fromBase64(env.salt), iterations: env.iter, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: fromBase64(env.iv) }, key, fromBase64(env.data),
        );
      })
      .then(function (buffer) {
        if (rm.checked) { try { sessionStorage.setItem(KEY, password); } catch (e) {} }
        var html = new TextDecoder().decode(buffer);
        document.open();
        document.write(html);
        document.close();
      });
  }

  function attempt(password, automatic) {
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Descifrando...';
    unlock(password).catch(function () {
      try { sessionStorage.removeItem(KEY); } catch (e) {}
      err.textContent = automatic
        ? 'La contraseña guardada ya no sirve. Escríbela de nuevo.'
        : 'Contraseña incorrecta.';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      pw.value = '';
      pw.focus();
    });
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    attempt(pw.value, false);
  });

  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) attempt(saved, true);
})();
</script>
