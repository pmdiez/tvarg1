<script>
jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';

function getParameterByName(name) {
    name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
    var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
    results = regex.exec(location.search);
    return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
}

var getURL = getParameterByName('get');
var getKEY  = getParameterByName('key');
var getKEY2 = getParameterByName('key2');

if (getURL == "") {
    alert('Falta el parámetro "get" en la URL');
} else {
    console.log("Canal solicitado:", atob(getURL));
    
    // Prueba simple: ESPN2
    var testMPD = "//cdn.cvattv.com.ar/live/c6eds/ESPN2_Arg/SA_Live_dash_enc_C/ESPN2_Arg.mpd";
    
    var player = jwplayer("player");
    player.setup({
        playlist: [{

                    }

        }],

    });
}
