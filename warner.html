</head>
<body>
    <div id="player"></div>

        <script>
        const sources = [{
            file: "https://ciades.providers.com.ar/WARNER/index.mpd?token=Sf72kl98hw16kx40vb32qu63%C3%B1z61th25&dvr_window_length=30",
            drm: {
                "clearkey": {
                    "keyId": "a319626ac2054f07990f43ba35535c47",
                    "key": "7cd36113800fcbfab64bff7a38144c70"
                }
            }
        }];

        const player = jwplayer("player");
        player.setup({
            playlist: [{
                title: "",
                description: "",
                sources: sources
            }],
            width: "100%",
            height: "100%",
            autostart: true,
            mute: false,
            cast: {},
            sharing: {},
            displaytitle: true,
            stretching: "uniform",
            preload: "auto",
            liveSyncDuration: 3,
        });

        // Configurar idioma preferido (Español)
        const syncSpanishAudio = () => {
            const availableTracks = player.getAudioTracks();
            if (!availableTracks || availableTracks.length === 0) return;

            const spanishKeywords = ['es', 'spa', 'español', 'castellano', 'spanish'];

            for (let i = 0; i < availableTracks.length; i++) {
                const track = availableTracks[i];
                const trackIdentifier = `${track.language} ${track.name} ${track.label}`.toLowerCase();

                const isSpanish = spanishKeywords.some(keyword => trackIdentifier.includes(keyword));

                if (isSpanish) {
                    if (player.getCurrentAudioTrack() !== i) {
                        player.setCurrentAudioTrack(i);
                    }
                    player.off("audioTracks", syncSpanishAudio);
                    break;
                }
            }
        };

        player.on("audioTracks", syncSpanishAudio);

        playerInstance.on('error', function(errorEvent) {
                console.log("sale el error");
                window.parent.postMessage({ error: errorEvent.code}, '*');
        });

        // Escuchar mensajes del iframe
        window.addEventListener('load', () => {
            window.addEventListener('message', (event) => {
                // Depuración: Verificar el mensaje recibido
                console.log("Mensaje recibido:", event.data);

                // Accede a la acción y al valor de manera segura
                const { action, value } = event.data;

                // Asegúrate de que action esté definido
                if (typeof action !== 'undefined') {
                    if (action === 'play') {
                        playerInstance.play();
                    } else if (action === 'stop') {
                        playerInstance.pause();
                    } else if (action === 'mute') {
                        playerInstance.setMute(true);
                    } else if (action === 'unmute') {
                        playerInstance.setMute(false);
                    } else if (action === 'volume') {
                        // Ajustar el volumen del reproductor
                        const newVolume = parseFloat(value);
                        playerInstance.setVolume(newVolume * 100);  // Asume que el valor de volumen es de 0 a 1
                    } else if (action === 'fullscreen') {
                        //playerInstance.setFullscreen(true);
                        // Luego intenta poner el documento en pantalla completa
                    // if (!document.fullscreenElement) {
                        //    document.documentElement.requestFullscreen();
                        //}
                    } else if (action === 'unfullscreen') {
                        //playerInstance.setFullscreen(false);
                    //document.exitFullscreen().catch((err) => {
                    //     console.error("Error al intentar salir de pantalla completa:", err);
                    // });
                    } else {
                        console.log("Acción no reconocida:", action);
                    }
                } else {
                    console.log("El mensaje no contiene una acción válida.");
                }
            });
        });
    </script>
