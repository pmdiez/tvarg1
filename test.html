<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">   <!-- ← Esta línea es clave -->
    <title>Test ESPN - dash.js</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    
    <style>
        body, html { margin:0; padding:0; background:#000; color:white; }
        #videoContainer { width:100vw; height:100vh; }
        video { width:100%; height:100%; }
        #status { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.8); padding:12px; border-radius:6px; z-index:100; }
    </style>
</head>
<body>

<div id="status">Intentando cargar ESPN...</div>
<div id="videoContainer">
    <video id="videoPlayer" controls autoplay></video>
</div>

<script>
const manifestUrl = "https://cdn.cvattv.com.ar/live/c6eds/ESPN/SA_Live_dash_enc_C/ESPN.mpd";
const keyId = "cc8d44406ed6bf1898ad9f7a2d64f29e";
const key   = "fb85d059687ab0fc67805806204edbdf";

const video = document.getElementById("videoPlayer");
const statusEl = document.getElementById("status");

const player = dashjs.MediaPlayer().create();
player.initialize(video, manifestUrl, true);

player.setProtectionData({
    "clearkey": {
        "keySystem": "org.w3.clearkey",
        "clearkeys": {
            [keyId]: key
        }
    }
});

player.on(dashjs.MediaPlayer.events.ERROR, e => {
    console.error(e);
    statusEl.textContent = "Error: " + (e.error?.message || "Revisa consola");
});
</script>
</body>
</html>
