<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test ESPN - dash.js + ClearKey</title>

    <!-- dash.js CDN -->
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }
        #videoContainer {
            width: 100vw;
            height: 100vh;
        }
        video {
            width: 100%;
            height: 100%;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="status">Cargando ESPN con dash.js...</div>
<div id="videoContainer">
    <video id="videoPlayer" controls autoplay></video>
</div>

<script>
// ==================== CONFIGURACIÓN ====================
const manifestUrl = "https://cdn.cvattv.com.ar/live/c6eds/ESPN/SA_Live_dash_enc_C/ESPN.mpd";

const keyId = "cc8d44406ed6bf1898ad9f7a2d64f29e";
const key   = "fb85d059687ab0fc67805806204edbdf";
// =======================================================

const video = document.getElementById("videoPlayer");
const statusEl = document.getElementById("status");

const player = dashjs.MediaPlayer().create();

// Configuración básica
player.initialize(video, manifestUrl, true); // true = autoplay

// ==================== ClearKey DRM ====================
player.setProtectionData({
    "clearkey": {
        "com.widevine.alpha": {
            "server": "https://example.com"  // No se usa realmente en ClearKey
        },
        "keySystem": "org.w3.clearkey",
        "clearkeys": {
            [keyId]: key
        }
    }
});

// Eventos para debug
player.on(dashjs.MediaPlayer.events.ERROR, function(e) {
    console.error("ERROR:", e);
    statusEl.innerHTML = `Error: ${e.error ? e.error.message : e}`;
});

player.on(dashjs.MediaPlayer.events.MANIFEST_LOADED, function() {
    console.log("✅ Manifest cargado correctamente");
    statusEl.innerHTML = "Manifest cargado - Reproduciendo ESPN";
});

player.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function() {
    console.log("✅ Stream inicializado");
});

console.log("dash.js iniciado con ClearKey para ESPN");
</script>

</body>
</html>
