<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor de Token</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: #1a1a1a;
            border: 2px solid #00ff00;
            border-radius: 15px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            color: #00ff00;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        
        .status {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 80px;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: break-word;
            word-break: break-all;
        }
        
        .status.success {
            border-color: #00ff00;
            color: #00ff00;
        }
        
        .status.error {
            border-color: #ff0000;
            color: #ff0000;
        }
        
        .status.loading {
            border-color: #ffff00;
            color: #ffff00;
        }
        
        .status.info {
            border-color: #0088ff;
            color: #0088ff;
        }
        
        .token-box {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-size: 12px;
            overflow-wrap: break-word;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }
        
        .token-box::-webkit-scrollbar {
            width: 8px;
        }
        
        .token-box::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        .token-box::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        button {
            background: #0a0a0a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        
        button:hover {
            background: #00ff00;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button.danger {
            border-color: #ff0000;
            color: #ff0000;
        }
        
        button.danger:hover {
            background: #ff0000;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
        
        .info {
            color: #888;
            font-size: 12px;
            margin-top: 15px;
            text-align: center;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
        
        .copy-success {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff00;
            color: #0a0a0a;
            padding: 10px 30px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #00ff00;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .badge {
            display: inline-block;
            background: #00ff00;
            color: #0a0a0a;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .manual-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .manual-input input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #00ff00;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .manual-input input:focus {
            border-color: #00ff00;
            outline: none;
        }
        
        .method-tag {
            display: inline-block;
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 EXTRACTOR DE TOKEN</h1>
        
        <div id="status" class="status loading">
            <span class="spinner"></span> Inicializando...
        </div>
        
        <div id="tokenContainer" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <span style="font-size:12px; color:#888;">TOKEN EXTRAÍDO:</span>
                <span class="badge" id="tokenLength">0</span>
            </div>
            <div class="token-box" id="tokenDisplay">Esperando token...</div>
        </div>
        
        <div class="manual-input">
            <input type="text" id="manualToken" placeholder="O pega el token manualmente aquí...">
            <button id="manualBtn" style="flex:0.3;">📥 Usar</button>
        </div>
        
        <div class="button-group">
            <button id="extractBtn">🔄 Extraer Token</button>
            <button id="copyBtn">📋 Copiar</button>
            <button id="openPage">🌐 Abrir Página</button>
            <button id="clearBtn" class="danger">🗑️ Limpiar</button>
        </div>
        
        <div class="info">
            <span id="lastUpdate">Última actualización: ---</span>
            <br>
            <span id="methodInfo" style="color:#555;"></span>
        </div>
    </div>
    
    <div id="copyNotification" class="copy-success">✅ ¡Token copiado al portapapeles!</div>

    <script>
        // ============================================
        // EXTRACTOR DE TOKEN - Múltiples métodos
        // ============================================
        
        const STATUS = document.getElementById('status');
        const TOKEN_DISPLAY = document.getElementById('tokenDisplay');
        const TOKEN_CONTAINER = document.getElementById('tokenContainer');
        const TOKEN_LENGTH = document.getElementById('tokenLength');
        const LAST_UPDATE = document.getElementById('lastUpdate');
        const METHOD_INFO = document.getElementById('methodInfo');
        const COPY_NOTIFICATION = document.getElementById('copyNotification');
        const MANUAL_INPUT = document.getElementById('manualToken');
        
        let currentToken = '';
        let extractionMethod = '';
        
        function setStatus(message, type = 'loading') {
            STATUS.className = `status ${type}`;
            STATUS.innerHTML = message;
        }
        
        function showCopyNotification() {
            COPY_NOTIFICATION.style.display = 'block';
            setTimeout(() => {
                COPY_NOTIFICATION.style.display = 'none';
            }, 3000);
        }
        
        function displayToken(token, method = '') {
            currentToken = token;
            TOKEN_DISPLAY.textContent = token;
            TOKEN_LENGTH.textContent = `${token.length} caracteres`;
            TOKEN_CONTAINER.style.display = 'block';
            localStorage.setItem('savedToken', token);
            
            const fecha = new Date().toLocaleString();
            LAST_UPDATE.textContent = `Última actualización: ${fecha}`;
            
            if (method) {
                METHOD_INFO.textContent = `Método: ${method}`;
            }
        }
        
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (err) {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    return true;
                } catch (e) {
                    return false;
                }
            }
        }
        
        // ============================================
        // MÉTODO 1: Usar un proxy CORS gratuito
        // ============================================
        async function extractWithProxy() {
            setStatus('🔄 Intentando con proxy CORS...', 'loading');
            
            const proxies = [
                'https://api.allorigins.win/raw?url=',
                'https://corsproxy.io/?',
                'https://api.codetabs.com/v1/proxy?quest='
            ];
            
            const targetUrl = 'https://zonatv.store/cvatt55.html?get=QXJ0ZWFySEQ&start=true';
            
            for (const proxy of proxies) {
                try {
                    setStatus(`🔄 Probando proxy: ${proxy}...`, 'loading');
                    const response = await fetch(proxy + encodeURIComponent(targetUrl));
                    const html = await response.text();
                    
                    if (html && html.length > 100) {
                        const token = findToken(html);
                        if (token) {
                            displayToken(token, 'Proxy CORS');
                            setStatus(`✅ Token extraído con proxy: ${proxy.split('/')[2]}`, 'success');
                            return token;
                        }
                    }
                } catch (e) {
                    console.log(`Proxy ${proxy} falló:`, e.message);
                }
            }
            return null;
        }
        
        // ============================================
        // MÉTODO 2: Usar JSONP (alternativa)
        // ============================================
        function findToken(html) {
            const regex = /tok_[a-zA-Z0-9\-_=]+\.[a-zA-Z0-9\-_=]+\.[a-zA-Z0-9\-_=]+/g;
            const matches = html.match(regex);
            
            if (matches) {
                // Buscar el token más largo (el completo)
                let longest = '';
                for (const match of matches) {
                    if (match.length > 100 && match.length > longest.length) {
                        longest = match;
                    }
                }
                return longest || null;
            }
            return null;
        }
        
        // ============================================
        // MÉTODO 3: Cargar en un iframe (alternativa)
        // ============================================
        function extractWithIframe() {
            return new Promise((resolve) => {
                setStatus('🔄 Cargando página en iframe...', 'loading');
                
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = 'https://zonatv.store/cvatt55.html?get=QXJ0ZWFySEQ&start=true';
                document.body.appendChild(iframe);
                
                let attempts = 0;
                const maxAttempts = 20;
                
                const checkIframe = setInterval(() => {
                    attempts++;
                    try {
                        const html = iframe.contentDocument?.documentElement?.innerHTML || '';
                        if (html && html.length > 100) {
                            const token = findToken(html);
                            if (token) {
                                clearInterval(checkIframe);
                                document.body.removeChild(iframe);
                                displayToken(token, 'iframe');
                                setStatus('✅ Token extraído del iframe', 'success');
                                resolve(token);
                                return;
                            }
                        }
                    } catch (e) {
                        // Error de cross-origin, esperamos
                    }
                    
                    if (attempts >= maxAttempts) {
                        clearInterval(checkIframe);
                        document.body.removeChild(iframe);
                        resolve(null);
                    }
                }, 500);
            });
        }
        
        // ============================================
        // MÉTODO PRINCIPAL
        // ============================================
        async function extractToken() {
            setStatus('🔍 Buscando token...', 'loading');
            TOKEN_CONTAINER.style.display = 'none';
            
            // Probar métodos en secuencia
            let token = null;
            
            // Método 1: Proxy
            token = await extractWithProxy();
            if (token) {
                await copyToClipboard(token);
                showCopyNotification();
                return token;
            }
            
            // Método 2: iframe
            token = await extractWithIframe();
            if (token) {
                await copyToClipboard(token);
                showCopyNotification();
                return token;
            }
            
            // Si todo falla
            setStatus('❌ No se pudo extraer el token automáticamente. Pega el token manualmente.', 'error');
            return null;
        }
        
        // ============================================
        // MANEJO MANUAL
        // ============================================
        document.getElementById('manualBtn').addEventListener('click', () => {
            const token = MANUAL_INPUT.value.trim();
            if (token && token.startsWith('tok_') && token.length > 50) {
                displayToken(token, 'Manual');
                setStatus('✅ Token cargado manualmente', 'success');
                copyToClipboard(token);
                showCopyNotification();
                MANUAL_INPUT.value = '';
            } else {
                setStatus('❌ Token inválido. Debe empezar con "tok_" y tener más de 50 caracteres.', 'error');
            }
        });
        
        // ============================================
        // EVENT LISTENERS
        // ============================================
        document.getElementById('extractBtn').addEventListener('click', extractToken);
        
        document.getElementById('copyBtn').addEventListener('click', async () => {
            if (currentToken) {
                await copyToClipboard(currentToken);
                showCopyNotification();
            } else {
                alert('No hay token para copiar. Primero extrae uno.');
            }
        });
        
        document.getElementById('openPage').addEventListener('click', () => {
            window.open('https://zonatv.store/cvatt55.html?get=QXJ0ZWFySEQ&start=true', '_blank');
        });
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            currentToken = '';
            TOKEN_DISPLAY.textContent = 'Esperando token...';
            TOKEN_LENGTH.textContent = '0';
            TOKEN_CONTAINER.style.display = 'none';
            localStorage.removeItem('savedToken');
            setStatus('🧹 Token limpiado', 'loading');
            LAST_UPDATE.textContent = 'Última actualización: ---';
            METHOD_INFO.textContent = '';
        });
        
        // ============================================
        // INICIO
        // ============================================
        const savedToken = localStorage.getItem('savedToken');
        if (savedToken && savedToken.length > 100) {
            displayToken(savedToken, 'Guardado');
            setStatus('💾 Token cargado desde localStorage', 'success');
        } else {
            // Auto-extraer al cargar
            setTimeout(extractToken, 1000);
        }
    </script>
</body>
</html>
