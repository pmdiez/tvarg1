<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor de Token</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border: 2px solid #00ff00;
            border-radius: 15px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }
        h1 { text-align: center; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,255,0,0.3); }
        .status {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 80px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-all;
        }
        .status.success { border-color: #00ff00; color: #00ff00; }
        .status.error { border-color: #ff0000; color: #ff0000; }
        .status.loading { border-color: #ffff00; color: #ffff00; }
        .status.info { border-color: #0088ff; color: #0088ff; }
        .token-box {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-size: 12px;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }
        .token-box::-webkit-scrollbar { width: 8px; }
        .token-box::-webkit-scrollbar-track { background: #1a1a1a; }
        .token-box::-webkit-scrollbar-thumb { background: #00ff00; border-radius: 4px; }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        button {
            background: #0a0a0a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        button:hover {
            background: #00ff00;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
        button.danger { border-color: #ff0000; color: #ff0000; }
        button.danger:hover { background: #ff0000; color: #0a0a0a; }
        .info { color: #888; font-size: 12px; margin-top: 15px; text-align: center; border-top: 1px solid #333; padding-top: 15px; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #00ff00;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .badge {
            display: inline-block;
            background: #00ff00;
            color: #0a0a0a;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .copy-success {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff00;
            color: #0a0a0a;
            padding: 10px 30px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .manual-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .manual-input input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #00ff00;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .manual-input input:focus { border-color: #00ff00; outline: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 EXTRACTOR DE TOKEN</h1>
        
        <div id="status" class="status loading">
            <span class="spinner"></span> Inicializando...
        </div>
        
        <div id="tokenContainer" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <span style="font-size:12px; color:#888;">TOKEN EXTRAÍDO:</span>
                <span class="badge" id="tokenLength">0</span>
            </div>
            <div class="token-box" id="tokenDisplay">Esperando token...</div>
        </div>
        
        <div class="manual-input">
            <input type="text" id="manualToken" placeholder="O pega el token manualmente aquí...">
            <button id="manualBtn" style="flex:0.3;">📥 Usar</button>
        </div>
        
        <div class="button-group">
            <button id="extractBtn">🔄 Extraer Token</button>
            <button id="copyBtn">📋 Copiar</button>
            <button id="openPage">🌐 Abrir Página</button>
            <button id="clearBtn" class="danger">🗑️ Limpiar</button>
        </div>
        
        <div class="info">
            <span id="lastUpdate">Última actualización: ---</span>
        </div>
    </div>
    
    <div id="copyNotification" class="copy-success">✅ ¡Token copiado al portapapeles!</div>

    <script>
        // ============================================================
        // EXTRACTOR DE TOKEN - Usando proxy CORS
        // ============================================================
        
        const STATUS = document.getElementById('status');
        const TOKEN_DISPLAY = document.getElementById('tokenDisplay');
        const TOKEN_CONTAINER = document.getElementById('tokenContainer');
        const TOKEN_LENGTH = document.getElementById('tokenLength');
        const LAST_UPDATE = document.getElementById('lastUpdate');
        const COPY_NOTIFICATION = document.getElementById('copyNotification');
        const MANUAL_INPUT = document.getElementById('manualToken');
        
        let currentToken = '';
        let extractionMethod = '';
        
        function setStatus(message, type = 'loading') {
            STATUS.className = `status ${type}`;
            STATUS.innerHTML = message;
        }
        
        function showCopyNotification() {
            COPY_NOTIFICATION.style.display = 'block';
            setTimeout(() => { COPY_NOTIFICATION.style.display = 'none'; }, 3000);
        }
        
        function displayToken(token, method = '') {
            currentToken = token;
            TOKEN_DISPLAY.textContent = token;
            TOKEN_LENGTH.textContent = `${token.length} caracteres`;
            TOKEN_CONTAINER.style.display = 'block';
            localStorage.setItem('savedToken', token);
            LAST_UPDATE.textContent = `Última actualización: ${new Date().toLocaleString()}`;
            if (method) { document.getElementById('methodInfo').textContent = `Método: ${method}`; }
        }
        
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (err) {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    return true;
                } catch (e) { return false; }
            }
        }
        
        // ============================================================
        // BUSCAR TOKEN EN HTML
        // ============================================================
        function findToken(html) {
            // Buscar token completo
            const regex = /tok_[a-zA-Z0-9\-_=]+\.[a-zA-Z0-9\-_=]+\.[a-zA-Z0-9\-_=]+/g;
            const matches = html.match(regex);
            
            if (matches) {
                // Buscar el más largo (el completo)
                let longest = '';
                for (const match of matches) {
                    if (match.length > 100 && match.length > longest.length) {
                        longest = match;
                    }
                }
                return longest || null;
            }
            return null;
        }
        
        // ============================================================
        // EXTRAER CON PROXY CORS (MÚLTIPLES OPCIONES)
        // ============================================================
        async function extractToken() {
            setStatus('🔍 Buscando token...', 'loading');
            TOKEN_CONTAINER.style.display = 'none';
            
            const targetUrl = 'https://zonatv.store/cvatt55.html?get=QXJ0ZWFySEQ&start=true';
            
            // Lista de proxies CORS gratuitos
            const proxies = [
                {
                    url: `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                    name: 'AllOrigins'
                },
                {
                    url: `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
                    name: 'CORSProxy'
                },
                {
                    url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
                    name: 'CodeTabs'
                },
                {
                    url: `https://thingproxy.freeboard.io/fetch/${targetUrl}`,
                    name: 'Freeboard'
                }
            ];
            
            for (const proxy of proxies) {
                try {
                    setStatus(`🔄 Probando ${proxy.name}...`, 'loading');
                    
                    const response = await fetch(proxy.url, {
                        signal: AbortSignal.timeout(15000)
                    });
                    
                    if (!response.ok) {
                        console.log(`${proxy.name} falló: ${response.status}`);
                        continue;
                    }
                    
                    const html = await response.text();
                    
                    if (html && html.length > 100) {
                        const token = findToken(html);
                        if (token) {
                            displayToken(token, `Proxy ${proxy.name}`);
                            setStatus(`✅ Token extraído con ${proxy.name}`, 'success');
                            
                            // Copiar automáticamente
                            await copyToClipboard(token);
                            showCopyNotification();
                            return token;
                        }
                    }
                } catch (e) {
                    console.log(`${proxy.name} error:`, e.message);
                }
            }
            
            // Si todos los proxies fallan
            setStatus(`❌ No se pudo extraer el token automáticamente.
                
Posibles soluciones:
1. Pega el token manualmente en el campo de arriba
2. Abre la página original y copia el token
3. Reintenta más tarde (los proxies pueden estar caídos)

URL original: ${targetUrl}`, 'error');
            
            return null;
        }
        
        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        
        document.getElementById('extractBtn').addEventListener('click', extractToken);
        
        document.getElementById('copyBtn').addEventListener('click', async () => {
            if (currentToken) {
                await copyToClipboard(currentToken);
                showCopyNotification();
            } else {
                alert('No hay token para copiar. Primero extrae uno.');
            }
        });
        
        document.getElementById('openPage').addEventListener('click', () => {
            window.open('https://zonatv.store/cvatt55.html?get=QXJ0ZWFySEQ&start=true', '_blank');
        });
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            currentToken = '';
            TOKEN_DISPLAY.textContent = 'Esperando token...';
            TOKEN_LENGTH.textContent = '0';
            TOKEN_CONTAINER.style.display = 'none';
            localStorage.removeItem('savedToken');
            setStatus('🧹 Token limpiado', 'loading');
            LAST_UPDATE.textContent = 'Última actualización: ---';
        });
        
        document.getElementById('manualBtn').addEventListener('click', () => {
            const token = MANUAL_INPUT.value.trim();
            if (token && token.startsWith('tok_') && token.length > 50) {
                displayToken(token, 'Manual');
                setStatus('✅ Token cargado manualmente', 'success');
                copyToClipboard(token);
                showCopyNotification();
                MANUAL_INPUT.value = '';
            } else {
                setStatus('❌ Token inválido. Debe empezar con "tok_" y tener más de 50 caracteres.', 'error');
            }
        });
        
        // ============================================================
        // INICIO - Cargar token guardado o extraer automáticamente
        // ============================================================
        const savedToken = localStorage.getItem('savedToken');
        if (savedToken && savedToken.length > 100) {
            displayToken(savedToken, 'Guardado');
            setStatus('💾 Token cargado desde localStorage', 'success');
        } else {
            // Extraer automáticamente después de 1 segundo
            setTimeout(extractToken, 1000);
        }
    </script>
</body>
</html>
